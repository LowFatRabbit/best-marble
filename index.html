<style>
@font-face{font-family:"Gaegu";font-weight:400;font-style:normal;font-display:swap;src:url("gaegu-400.woff2") format("woff2")}
@font-face{font-family:"Gaegu";font-weight:700;font-style:normal;font-display:swap;src:url("gaegu-700.woff2") format("woff2")}
@font-face{font-family:"Gamja Flower";font-weight:400;font-style:normal;font-display:swap;src:url("gamja-flower.woff2") format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;overscroll-behavior:none}
body{-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one sketchbook page lying on a table. The board copies the kid's drawing —
   pencil spokes fan out from a center box to the page edge; the box holds dice, players and turn. */
:root{
  --table:#d5cab5;
  --paper:#fbfaf5;
  --paper-hi:#ffffff;
  --graphite:#4d4d55;
  --graphite-soft:#7f7e87;
  --ink:#37373d;
  --note:#fff1a8;
  --heart:#e0564a;
  --gold:#f2c94c;
  --p0:#d8473b; --p1:#3a69c9; --p2:#3a9748; --p3:#e2a018;
  --font-hand:"Gaegu","Gamja Flower","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --font-big:"Gamja Flower","Gaegu","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --hand-radius:255px 15px 225px 15px / 15px 225px 15px 255px;
  color-scheme: light;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;background:var(--table);color:var(--ink);font-family:var(--font-hand);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2.5px dashed var(--graphite);outline-offset:3px}

#stage{position:relative;height:100%;display:grid;place-items:center;container-type:size;
  padding-block:24px 10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px))}
#rotateHint{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:15px;font-weight:700;color:var(--graphite);display:none}
@media (orientation:portrait) and (max-width:820px){ #rotateHint{display:block} }

#paper{position:relative;width:min(100cqw, 100cqh * 1.4);height:min(100cqw / 1.4, 100cqh);container-type:size}
.backing{position:absolute;inset:0;background:#a4a4ab;border-radius:3px;transform:translate(-0.7cqw,0.6cqw)}
.sheet{position:absolute;inset:0;background-color:var(--paper);border-radius:2px;
  box-shadow:0 0.3cqw 0 #e6e2d8, 0 1.2cqw 2.6cqw rgba(70,55,30,.22)}
.spiral{position:absolute;left:2.5%;right:2.5%;top:-1.5cqw;height:3.4cqw;z-index:3;pointer-events:none;
  background-repeat:repeat-x;background-size:1.75cqw 100%}
#board{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:hidden}

/* board drawing */
.pl1{fill:none;stroke:var(--graphite);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.88}
.pl2{fill:none;stroke:var(--graphite);stroke-width:1.6;stroke-linecap:round;opacity:.5}
.doodle{fill:none;stroke:var(--graphite);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.doodle .dot{fill:var(--graphite);stroke:none}
.doodle .thin{stroke-width:2}
.doodle .pf{fill:var(--paper)}
.doodle .dt{fill:var(--graphite);stroke:none;font-family:var(--font-hand);font-weight:700;text-anchor:middle}
.lbl{font-family:var(--font-hand);font-weight:700;font-size:31px;fill:var(--ink);text-anchor:middle}
.fo{stroke:var(--graphite);stroke-width:2.5}
.fl{fill:none;stroke:var(--graphite);stroke-width:2.5;stroke-linecap:round}
.fd{fill:var(--graphite)}
.fskin{fill:#fff8ee;stroke-width:4.5}
.halo{fill:var(--paper);opacity:.82}
.bob.on{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.hl{fill:none;stroke-width:5;stroke-linecap:round;opacity:.85;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* center box */
#center{position:absolute;left:30.6%;top:30.4%;width:39%;height:39.6%;z-index:2;display:flex;flex-direction:column;
  justify-content:center;gap:0.8cqw;text-align:center}
.title{font-family:var(--font-big);font-weight:400;font-size:3.7cqw;line-height:1;margin:0;display:flex;align-items:center;justify-content:center;gap:.7cqw;color:var(--ink)}
.title svg{width:3.3cqw;height:3.3cqw;flex:none}
.title .sub{font-size:2.6cqw}
.oheart{fill:none;stroke:var(--graphite);stroke-width:7;stroke-linejoin:round}
.hi{width:1.6cqw;height:1.6cqw;flex:none;fill:var(--heart);stroke:var(--graphite);stroke-width:8;stroke-linejoin:round}

.mid{display:grid;grid-template-columns:1fr auto 1fr;gap:1cqw;align-items:center}
.col{display:flex;flex-direction:column;gap:.7cqw;min-width:0}
.pchip{position:relative;display:grid;grid-template-columns:3.7cqw 1fr;column-gap:.6cqw;align-items:center;text-align:left;
  padding:.45cqw .7cqw;border:2.5px solid transparent;border-radius:var(--hand-radius);min-width:0}
.pchip .cface{grid-row:1 / 3;width:3.7cqw;height:3.7cqw}
.pchip .cface svg{width:100%;height:100%;overflow:visible}
.cname{font-weight:700;font-size:1.95cqw;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cstat{font-size:1.7cqw;line-height:1.15;display:flex;align-items:center;gap:.35cqw;white-space:nowrap;font-variant-numeric:tabular-nums}
.cstat b{font-weight:700}
.pchip.turn{border-color:var(--pc);
  background:repeating-linear-gradient(-35deg, color-mix(in srgb, var(--pc) 24%, transparent) 0 3px, transparent 3px 8px)}
.pchip.pop .cstat b{display:inline-block;animation:pop .5s ease-out}
@keyframes pop{40%{transform:scale(1.6)}}

.dice{width:8.8cqw;height:8.8cqw;padding:0;border:none;background:none;cursor:pointer;display:block}
.dice svg{width:100%;height:100%;display:block;overflow:visible}
.die-body{fill:var(--paper-hi);stroke:var(--graphite);stroke-width:4.5;stroke-linejoin:round}
.pip{fill:var(--pc, var(--graphite))}
.dice.ready{animation:nudge 1.8s ease-in-out infinite}
.dice.rolling{animation:shake .16s linear infinite}
.dice:disabled{cursor:default}
.dice:disabled:not(.rolling){opacity:.45}
@keyframes nudge{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-8deg)}86%{transform:rotate(7deg)}93%{transform:rotate(-3deg)}}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,2px) rotate(-12deg)}50%{transform:translate(3px,-2px) rotate(10deg)}75%{transform:translate(-2px,-3px) rotate(-6deg)}100%{transform:translate(0,0) rotate(0)}}
.dlabel{font-size:1.65cqw;font-weight:700;margin-top:.3cqw;color:var(--graphite)}
.msg{font-size:2cqw;font-weight:700;line-height:1.15}
.msg small{display:block;font-size:1.55cqw;font-weight:400;color:var(--graphite-soft);margin-top:.2cqw}
.tools{display:flex;justify-content:center;gap:1.6cqw}
.tools button{font-weight:700;font-size:1.55cqw;color:var(--graphite-soft);background:none;border:none;border-bottom:1.5px dashed currentColor;padding:.1cqw .2cqw;cursor:pointer}

/* setup */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw 1.4cqw}
.prow{display:flex;align-items:center;gap:.6cqw;min-width:0}
.prow .face{width:4.2cqw;height:4.2cqw;flex:none;padding:0;border:none;background:none;cursor:pointer;transition:opacity .2s, transform .2s}
.prow .face svg{width:100%;height:100%;overflow:visible}
.prow.off .face{opacity:.3;transform:scale(.85)}
.prow.off input{opacity:.4;text-decoration:line-through}
.prow input{min-width:0;width:100%;font:700 2cqw var(--font-hand);color:var(--ink);background:transparent;border:none;
  border-bottom:2px solid var(--graphite-soft);padding:.2cqw .3cqw;border-radius:0}
.prow input:focus{outline:none;border-bottom-color:var(--graphite)}
.rounds{display:flex;align-items:center;justify-content:center;gap:.7cqw;flex-wrap:wrap;font-size:1.75cqw;font-weight:700}
.chip{font-weight:700;font-size:1.7cqw;padding:.25cqw 1cqw;border:2px solid var(--graphite-soft);border-radius:var(--hand-radius);background:none;cursor:pointer}
.chip.on{border-color:var(--graphite);background:var(--note)}
.actions{display:flex;justify-content:center;align-items:center;gap:.9cqw;flex-wrap:wrap}

/* buttons */
.btn{font-weight:700;font-size:2.15cqw;line-height:1.1;padding:.6cqw 1.6cqw;background:var(--paper-hi);color:var(--ink);
  border:2.5px solid var(--graphite);border-radius:var(--hand-radius);cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:repeating-linear-gradient(-35deg, color-mix(in srgb, var(--pc, var(--p3)) 40%, transparent) 0 3px, transparent 3px 7px), var(--paper-hi)}
.btn.small{font-size:1.7cqw;padding:.4cqw 1.1cqw;border-width:2px}
.btn.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.07) rotate(-1.5deg)}}

/* modal card */
#modal{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(251,250,245,.6)}
#modal[hidden]{display:none}
.card{position:relative;width:min(62cqw, 94%);max-height:90cqh;overflow:auto;background-color:var(--paper);
  border:2.5px solid var(--graphite);border-radius:18px 6px 22px 8px / 8px 20px 6px 18px;padding:2.2cqw 2.6cqw;
  box-shadow:0 1.2cqw 2.4cqw rgba(70,55,30,.24);transform:rotate(-.6deg);animation:cardin .28s ease-out}
.card.wide{width:min(74cqw, 96%)}
.card.flip{animation:flip .5s ease-out}
.card::before{content:"";position:absolute;top:.4cqw;left:50%;width:11cqw;height:2cqw;transform:translateX(-50%) rotate(2deg);
  background:rgba(236,220,160,.7);pointer-events:none}
@keyframes cardin{from{transform:rotate(-.6deg) translateY(2cqw) scale(.96);opacity:0}}
@keyframes flip{from{transform:rotate(-.6deg) rotateY(90deg)}}
.cardgrid{display:grid;grid-template-columns:16cqw 1fr;gap:2.2cqw;align-items:center}
.cdoodle svg{width:100%;height:auto;display:block}
.doodle.big{stroke-width:2.6}
.eyebrow{display:flex;align-items:center;gap:.6cqw;font-size:1.8cqw;font-weight:700;color:var(--graphite-soft)}
.eyebrow svg{width:2.6cqw;height:2.6cqw;overflow:visible}
.card h2{font-family:var(--font-big);font-weight:400;font-size:4.6cqw;line-height:1.05;margin:.3cqw 0 .8cqw;text-wrap:balance;color:var(--ink)}
.card p{font-size:2.15cqw;line-height:1.35;margin:0 0 1.1cqw;max-width:36em}
.card p.cnote{font-size:1.75cqw;color:var(--graphite-soft)}
.cbtns{display:flex;flex-wrap:wrap;gap:1cqw;margin-top:.4cqw}
.timer{display:flex;align-items:center;gap:1.2cqw;margin:0 0 1cqw}
.tnum{font-family:var(--font-big);font-size:5.6cqw;line-height:1;min-width:6cqw;font-variant-numeric:tabular-nums}
.tnum.done{color:var(--p2)}

/* rules, results, edit */
.rules{margin:0 0 1.2cqw;padding-left:2.6cqw;font-size:2cqw;line-height:1.45}
.rules li{padding-left:.3cqw}
.rank{list-style:none;margin:0 0 1cqw;padding:0;display:flex;flex-direction:column;gap:.7cqw}
.rank li{display:grid;grid-template-columns:3cqw 4cqw 1fr auto auto;gap:1cqw;align-items:center;font-size:2.1cqw;padding:.3cqw .6cqw;border-radius:var(--hand-radius)}
.rank li.first{background:repeating-linear-gradient(-35deg, color-mix(in srgb, var(--gold) 45%, transparent) 0 3px, transparent 3px 7px)}
.rank .rk{font-family:var(--font-big);font-size:3cqw;text-align:center}
.rank .rface svg{width:4cqw;height:4cqw;overflow:visible}
.rank .rname{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rstat{color:var(--graphite-soft);font-size:1.75cqw;font-variant-numeric:tabular-nums}
.rank .rscore{font-family:var(--font-big);font-size:3cqw;font-variant-numeric:tabular-nums}
.crown{width:7cqw;height:auto}
.crown path{fill:var(--gold);stroke:var(--graphite);stroke-width:3;stroke-linejoin:round}
.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6cqw 2cqw;margin:0 0 1.2cqw}
.editgrid label{display:flex;align-items:center;gap:.8cqw;font-size:1.9cqw;min-width:0}
.editgrid label span{width:2.6cqw;text-align:right;color:var(--graphite-soft);font-variant-numeric:tabular-nums;flex:none}
.editgrid input{flex:1;min-width:0;font:700 1.95cqw var(--font-hand);color:var(--ink);border:none;border-bottom:2px solid var(--graphite-soft);background:transparent;padding:.15cqw .3cqw;border-radius:0}
.editgrid input:focus{outline:none;border-bottom-color:var(--graphite)}
.editgrid em{font-style:normal;font-weight:700;color:var(--graphite-soft);padding:.15cqw .3cqw}

/* toasts */
#toasts{position:absolute;left:50%;top:31%;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;gap:.6cqw;align-items:center;pointer-events:none}
.toast{background:var(--note);padding:.55cqw 1.6cqw;font-size:2.1cqw;font-weight:700;white-space:nowrap;
  box-shadow:0 .4cqw .9cqw rgba(70,55,30,.2);transform:rotate(-1.5deg);animation:tin 2.3s ease-in-out forwards}
.toast:nth-child(even){transform:rotate(1.2deg)}
@keyframes tin{0%{opacity:0;translate:0 1cqw}12%,80%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -1cqw}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}
  .bob.on,.dice.ready{animation:none!important}
  .hl{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div id="stage">
  <div id="rotateHint">아이패드를 가로로 놓으면 판이 커져요</div>
  <div id="paper">
    <div class="backing" aria-hidden="true"></div>
    <div class="sheet" aria-hidden="true"></div>
    <div class="spiral" aria-hidden="true"></div>
    <svg id="board" viewBox="0 0 1400 1000" role="img" aria-label="미션 게임 판">
      <defs id="defs"></defs>
      <g id="owned" filter="url(#pencil)"></g>
      <g id="lines" filter="url(#pencil)"></g>
      <g id="art" class="doodle" filter="url(#pencil)"></g>
      <g id="labels"></g>
      <g id="flags"></g>
      <g id="hl"></g>
      <g id="tokens"></g>
    </svg>
    <div id="center"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="modal" hidden><div id="card" class="card" role="dialog" aria-modal="true"></div></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const N = 20, PHI = 0.33;
const START_HEARTS = 5, LAND_COST = 2, TOLL = 1, PASS_BONUS = 3;
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- squares (order = play order, counter-clockwise from 출발) ---------- */
const DEF = [
  {type:'start',   name:'출발', doodle:'start'},
  {type:'mission', name:'엉덩이 차기', doodle:'buttkick', hint:'발뒤꿈치로 내 엉덩이를 톡톡톡 다섯 번 차요.'},
  {type:'mission', name:'다리찢기 10초', doodle:'split', hint:'다리를 쫙 벌리고 10초 버텨요. 살려~!'},
  {type:'mission', name:'엉덩이로 이름 쓰기', doodle:'buttname', hint:'엉덩이를 흔들어서 내 이름을 써요. 다른 사람이 맞혀 봐요!'},
  {type:'mission', name:'발레 춤추기', doodle:'ballet', hint:'두 팔을 머리 위로 올리고 발끝으로 빙글 한 바퀴.'},
  {type:'mission', name:'좀비처럼 움직이기', doodle:'zombie', hint:'팔을 앞으로 쭉 뻗고 어기적어기적 다섯 걸음.'},
  {type:'mission', name:'10초 얼음', doodle:'ice', hint:'얼음! 10초 동안 꼼짝 마요. 웃어도 안 돼요.'},
  {type:'mission', name:'플라밍고 10초', doodle:'flamingo', hint:'한 발로 서서 10초 버텨요.'},
  {type:'mission', name:'독도는 우리땅', doodle:'dokdo', hint:'독도는 우리땅 노래를 한 소절 불러요.'},
  {type:'luck',    name:'행운 카드', doodle:'luck'},
  {type:'again',   name:'한 번 더', doodle:'again'},
  {type:'mission', name:'눈싸움하기', doodle:'stare', hint:'옆 사람과 눈싸움! 끝까지 눈을 크게 떠요.'},
  {type:'mission', name:'외계인 인사', doodle:'alien', hint:'외계인처럼 손을 흔들며 인사해요. 삐리삐리~'},
  {type:'mission', name:'내가 좋아하는 것은?', doodle:'like', hint:'내가 제일 좋아하는 것 세 가지를 말해요.'},
  {type:'mission', name:'발로 전화하기', doodle:'footphone', hint:'발을 전화기처럼 귀에 대고 "여보세요?"'},
  {type:'mission', name:'발로 아무거나 들기', doodle:'footlift', hint:'발가락으로 물건 하나를 집어 들어요.'},
  {type:'mission', name:'뽀뽀하기', doodle:'kiss', hint:'가족 한 명에게 뽀뽀 쪽!'},

/* ---------- board geometry: spokes from the center box to the page edge ---------- */
const OUTER = [[0,0],[1400,0],[1400,1000],[0,1000]];
const INNER = [[405,290],[995,278],[990,712],[410,722]];
function polyInfo(poly){
  const segs = []; let total = 0;
  poly.forEach((a, i) => { const b = poly[(i+1) % poly.length]; const len = Math.hypot(b[0]-a[0], b[1]-a[1]); segs.push({a, b, len, start: total}); total += len; });
  return {segs, total};
}
const OI = polyInfo(OUTER), II = polyInfo(INNER);
function at(info, t){
  t = ((t % 1) + 1) % 1; const d = t * info.total;
  for (const s of info.segs) if (d <= s.start + s.len + 1e-9) { const u = (d - s.start) / s.len; return [s.a[0] + (s.b[0]-s.a[0])*u, s.a[1] + (s.b[1]-s.a[1])*u]; }
  return info.segs[0].a.slice();
}
function between(info, a, b){
  const pts = [at(info, a)];
  for (let k = 0; k < 2; k++) for (const s of info.segs) { const tv = s.start / info.total + k; if (tv > a && tv < b) pts.push(s.a.slice()); }
  pts.push(at(info, b)); return pts;
}
const sideOf = r => (r === 5 || r === 9 || r === 15 || r === 19) ? 'corner' : r < 5 ? 'top' : r < 9 ? 'right' : r < 15 ? 'bottom' : 'left';
const LABEL_F = {top:.56, bottom:.6, left:.6, right:.6, corner:.68};
const TOKEN_F = {top:.15, bottom:.15, left:.14, right:.14, corner:.38};
const LABEL_NUDGE = {19:[14,14]};
const TOKEN_NUDGE = {5:[42,14], 15:[-42,-14]};
const GEO = [];
for (let r = 0; r < N; r++){
  const a = (r + PHI) / N, b = (r + 1 + PHI) / N, m = (a + b) / 2;
  const pin = at(II, m), pout = at(OI, m), side = sideOf(r);
  const lerp = f => [pin[0] + (pout[0]-pin[0])*f, pin[1] + (pout[1]-pin[1])*f];
  const label = lerp(LABEL_F[side]); const nd = LABEL_NUDGE[r];
  if (nd) { label[0] += nd[0]; label[1] += nd[1]; }
  const token = lerp(TOKEN_F[side]), tn = TOKEN_NUDGE[r];
  if (tn) { token[0] += tn[0]; token[1] += tn[1]; }
  GEO.push({a, b, side, label, token, poly: [...between(II, a, b), ...between(OI, a, b).reverse()]});
}
const regionOf = sq => ((5 - sq) % N + N) % N;
const OFF = [[-24,-24],[24,-24],[-24,24],[24,24]];
function spot(slot, sq){ const g = GEO[regionOf(sq)]; return [g.token[0] + OFF[slot][0], g.token[1] + OFF[slot][1]]; }

/* seeded pencil strokes so the board looks the same every time */
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(11);
function pencil(x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx, dy), ux = dx/len, uy = dy/len, nx = -uy, ny = ux;
  let out = '';
  for (let pass = 0; pass < 2; pass++){
    const segs = Math.max(2, Math.round(len / 90)), s0 = rnd()*4, s1 = rnd()*8, off = (rnd() - .5) * 3.2;
    let d = `M${(x1 - ux*s0 + nx*off).toFixed(1)},${(y1 - uy*s0 + ny*off).toFixed(1)}`;
    for (let i = 1; i <= segs; i++){
      const t = i / segs, ext = i === segs ? s1 : 0, j = (i === segs ? .4 : 1) * (rnd() - .5) * 4;
      d += ` L${(x1 + dx*t + ux*ext + nx*(off+j)).toFixed(1)},${(y1 + dy*t + uy*ext + ny*(off+j)).toFixed(1)}`;
    }
    out += `<path d="${d}" class="${pass ? 'pl2' : 'pl1'}"/>`;
  }
  return out;
}
const polyD = pts => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L') + ' Z';
function shrink(pts, k){ const cx = pts.reduce((s,p) => s + p[0], 0) / pts.length, cy = pts.reduce((s,p) => s + p[1], 0) / pts.length; return pts.map(p => [cx + (p[0]-cx)*k, cy + (p[1]-cy)*k]); }
function wrap(s, max = 5){
  const words = s.split(/\s+/).filter(Boolean), lines = []; let cur = '';
  for (const w of words){ if (!cur) cur = w; else if ((cur + ' ' + w).length <= max) cur += ' ' + w; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur);
  return lines.flatMap(l => l.length > 7 ? l.match(/.{1,6}/g) : [l]).slice(0, 3);
}

let AC = null;

function tone(f, dur, type = 'triangle', vol = .1, when = 0){
  if (!AC || !setup.sound) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .03);
}
function sfx(k){
  try {
    if (k === 'tick') tone(300 + Math.random()*280, .05, 'square', .04);
    else if (k === 'step') tone(720, .07, 'triangle', .08);
    else if (k === 'coin') { tone(988, .09, 'square', .05); tone(1319, .18, 'square', .05, .08); }
    else if (k === 'yay') [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .1, i * .08));
    else if (k === 'buy') { tone(784, .1); tone(1047, .22, 'triangle', .1, .1); }
    else if (k === 'pay') { tone(660, .1); tone(440, .2, 'triangle', .09, .1); }
    else if (k === 'beep') tone(880, .07, 'sine', .1);
    else if (k === 'done') { tone(1047, .14, 'triangle', .12); tone(1319, .3, 'triangle', .12, .12); }
  } catch (e) {}
}

/* ---------- game flow ---------- */
function gain(i, n){ state.players[i].hearts += n; }
function collect(i){ state.players.forEach((q, j) => { if (j !== i && q.hearts > 0) { q.hearts--; state.players[i].hearts++; } }); }
function giveAll(i){ const p = state.players[i]; state.players.forEach((q, j) => { if (j !== i && p.hearts > 0) { p.hearts--; q.hearts++; } }); }
const wait = ms => new Promise(r => setTimeout(r, ms));

function animateDice(v){
  return new Promise(res => {
    const el = $('#dice'); if (!el) return res();
    el.classList.remove('ready'); el.classList.add('rolling'); el.disabled = true;
    let k = 0; const total = RM ? 1 : 10;
    const iv = setInterval(() => {
      k++; el.innerHTML = dieSVG(k >= total ? v : 1 + Math.floor(Math.random() * 6)); sfx('tick');
      if (k >= total) { clearInterval(iv); el.classList.remove('rolling'); res(); }
    }, 70);
  });
}
function hop(i, from, to, dur){
  return new Promise(res => {
    const el = $('#tok' + i), slot = state.players[i].slot;
    const [ax, ay] = spot(slot, from), [bx, by] = spot(slot, to);
    if (!el || RM) { if (el) el.setAttribute('transform', `translate(${bx},${by})`); sfx('step'); return setTimeout(res, RM ? 60 : 0); }
    const t0 = performance.now();
    const f = now => {
      const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
      el.setAttribute('transform', `translate(${(ax + (bx-ax)*e).toFixed(1)},${(ay + (by-ay)*e - Math.sin(Math.PI*t) * 34).toFixed(1)})`);
      if (t < 1) requestAnimationFrame(f); else { sfx('step'); res(); }
    };
    requestAnimationFrame(f);
  });
}
async function moveSteps(i, steps){
  const p = state.players[i], dur = steps > 6 ? 130 : 240;
  const el = $('#tok' + i); if (el) { el.parentNode.appendChild(el); const b = el.querySelector('.bob'); if (b) b.classList.remove('on'); }
  for (let s = 0; s < steps; s++){
    const to = (p.pos + 1) % N;
    await hop(i, p.pos, to, dur);
    p.pos = to;
    if (to === 0) { p.hearts += PASS_BONUS; toast(`${p.name} 출발 통과! 하트 ${PASS_BONUS}개`); sfx('coin'); renderPanel(); }
  }
}
async function roll(){
  if (busy || state.phase !== 'play' || state.pending) return;
  busy = true; state.note = ''; unlockAudio();
  const i = state.turn, v = 1 + Math.floor(Math.random() * 6);
  await animateDice(v);
  state.lastRoll = v;
  $('.msg').innerHTML = `${esc(cur().name)}: ${v}칸 가요!`;
  await wait(RM ? 50 : 260);
  await moveSteps(i, v);

  busy = false;

}
function endTurn(again){

  state.pending = false;
  if (again) state.note = 'again';
  else {
    state.note = '';
    state.turn = (state.turn + 1) % state.players.length;
    if (state.turn === 0) {
      state.round++;
      if (state.maxRounds && state.round > state.maxRounds) { state.round = state.maxRounds; finish(); return; }
    }

  save(); renderAll();
}
function land(){
  const i = state.turn, p = cur(), sq = p.pos, d = DEF[sq];
  renderAll();
  highlight(sq, p.slot);
  if (d.type === 'start') { endTurn(); return; }
  if (d.type === 'again') { toast(`${p.name} 한 번 더!`); sfx('yay'); endTurn(true); return; }
  if (d.type === 'luck') { luckCard(); return; }
  const name = sqName(sq), owner = state.owners[sq];
  const m = name.match(/(\d+)\s*초/), timer = m ? Math.min(+m[1], 60) : 0;
  const base = {slot: p.slot, title: esc(name), doodle: sqDoodle(sq), body: esc(sqHint(sq)), timer};
  if (owner === -1){
    showCard({...base, eyebrow: `${who(p)} · 빈 땅`, note: `성공하면 하트 1개! 그리고 하트 ${LAND_COST}개로 이 땅을 살 수 있어요.`,
      buttons: [{label: '성공! 하트 +1', primary: true, fn: () => { gain(i, 1); sfx('yay'); renderPanel(); offerBuy(i, sq); }},
                {label: '다음에 할래요', fn: () => endTurn()}]});

    showCard({...base, eyebrow: `${who(p)} · 내 땅`, note: '내 땅에서 미션을 하면 하트 1개를 더 받아요.',

                {label: '쉬어 갈래요', fn: () => endTurn()}]});
  } else {
    const o = state.players[owner];
    showCard({...base, eyebrow: `${who(p)} · ${esc(o.name)}네 땅`, note: `${esc(o.name)}에게 통행료 하트 ${TOLL}개를 줘요. 미션에 성공하면 하트 1개를 받아요.`,
      buttons: [{label: '성공! 하트 +1', primary: true, fn: () => { payToll(i, owner); gain(i, 1); sfx('yay'); endTurn(); }},
                {label: '통행료만 낼게요', fn: () => { payToll(i, owner); endTurn(); }}]});
  }
}
function payToll(i, owner){
  const p = state.players[i], o = state.players[owner], amt = Math.min(TOLL, p.hearts);
  p.hearts -= amt; o.hearts += amt; sfx('pay');

function offerBuy(i, sq){

  showCard({slot: p.slot, doodle: sqDoodle(sq), eyebrow: `${who(p)} · 잘했어요!`, title: '이 땅을 살까요?',
    body: `하트 ${LAND_COST}개를 내면 '${esc(sqName(sq))}' 칸이 ${esc(p.name)}네 땅이 돼요.`,
    note: `친구가 여기 오면 통행료로 하트 ${TOLL}개를 받아요. 끝날 때 땅 하나는 2점이에요.`,
    buttons: [{label: `살래요! 하트 −${LAND_COST}`, primary: true, fn: () => { p.hearts -= LAND_COST; state.owners[sq] = i; sfx('buy'); toast(`${sqName(sq)} → ${p.name}네 땅!`); endTurn(); }},
              {label: '안 살래요', fn: () => endTurn()}]});

function luckCard(){

  sfx('coin');
  showCard({slot: p.slot, flip: true, doodle: 'luck', eyebrow: `${who(p)} · 행운 카드`, title: c.t, body: '',
    buttons: [{label: '좋아!', primary: true, fn: async () => {
      closeCard(); clearHighlight();
      const r = c.run(i) || {};
      renderPanel();
      if (r.again) { toast(`${p.name} 한 번 더!`); endTurn(true); return; }
      if (r.jump === 0 || r.steps) {
        busy = true; renderPanel();
        await moveSteps(i, r.jump === 0 ? (N - p.pos) % N || N : r.steps);
        busy = false;

      }

}
function ranking(){
  const rows = state.players.map((p, i) => ({i, slot: p.slot, name: p.name, hearts: p.hearts, lands: landsOf(i), score: scoreOf(i)}));
  rows.sort((a, b) => b.score - a.score || b.hearts - a.hearts);
  rows.forEach((r, k) => { r.rank = k && rows[k-1].score === r.score && rows[k-1].hearts === r.hearts ? rows[k-1].rank : k + 1; });
  return rows;
}
function finish(){ state.phase = 'end'; state.pending = false; closeCard(); clearHighlight(); save(); renderAll(); sfx('done'); showResults(); }

      <p class="cnote">점수 = 하트 + 땅 하나에 2점</p>`,

function newGame(){ state = blankState(); lsSet('choego.game', null); savedGame = null; busy = false; renderAll(); }
function startGame(){
  const players = setup.slots.map((s, slot) => ({slot, name: (s.name || '').trim() || DEFAULT_NAMES[slot], hearts: START_HEARTS, pos: 0, on: s.on}))

      <li>주사위를 톡! 나온 수만큼 칸을 가요.</li>
      <li>도착한 칸의 미션을 하면 하트 1개를 받아요.</li>
      <li>빈 땅에서 미션에 성공하면 하트 ${LAND_COST}개로 땅을 살 수 있어요.</li>
      <li>친구 땅에 가면 친구에게 통행료 하트 ${TOLL}개를 줘요.</li>
      <li>출발을 지나가면 하트 ${PASS_BONUS}개! 한 번 더 칸은 주사위를 또 굴려요.</li>
      <li>행운 카드를 뽑으면 무슨 일이 생길지 몰라요.</li>
      <li>끝나면 하트 + 땅(하나에 2점)으로 점수를 세요. 제일 많으면 최고!</li></ol>`,
    buttons: [{label: '알겠어요', primary: true, fn: closeCard}]});
}
function showEdit(){
  showCard({wide: true, dismiss: true, slot: 2, title: '미션 고치기',
    html: `<h2 id="cardTitle">미션 고치기</h2><p class="cnote">칸 이름을 바꿀 수 있어요. 이름을 바꾼 칸은 별 그림으로 바뀌고, '10초'처럼 초를 쓰면 타이머가 생겨요.</p>
      <div class="editgrid">${DEF.map((d, i) => d.type === 'mission'
        ? `<label><span>${i}</span><input id="m${i}" data-i="${i}" value="${esc(sqName(i))}" maxlength="14" autocomplete="off"></label>`
        : `<label><span>${i}</span><em>${esc(d.name)}</em></label>`).join('')}</div>`,
    buttons: [
      {label: '저장', primary: true, fn: () => {
        const next = DEF.map((d, i) => { const el = $('#m' + i); return d.type === 'mission' && el ? (el.value.trim() || d.name) : d.name; });
        missions = next.every((n, i) => n === DEF[i].name) ? null : next;
        lsSet('choego.missions', missions); renderBoard(); renderOwners(); closeCard(); toast('미션을 바꿨어요');
      }},
      {label: '처음대로', fn: () => { missions = null; lsSet('choego.missions', null); renderBoard(); renderOwners(); closeCard(); toast('처음 미션으로 돌아왔어요'); }},
      {label: '닫기', fn: closeCard}]});
}

/* ---------- input ---------- */
document.addEventListener('pointerdown', unlockAudio, {passive: true});
document.addEventListener('click', e => {
  const m = $('#modal');
  if (e.target === m && cardDismiss) { closeCard(); return; }
  const bEl = e.target.closest('[data-b]');
  if (bEl && m.contains(bEl)) { const fn = btnFns[+bEl.dataset.b]; if (fn) fn(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'toggle') {
    const i = +t.dataset.i, s = setup.slots[i];
    if (s.on && setup.slots.filter(x => x.on).length <= 2) { toast('두 명 이상 있어야 해요'); return; }
    s.on = !s.on; save(); renderPanel(); renderTokens();
  }
  else if (act === 'rounds') { setup.rounds = +t.dataset.n; save(); renderPanel(); }
  else if (act === 'start') startGame();
  else if (act === 'resume') { state = savedGame; busy = false; lastHearts = []; renderAll(); keepAwake(); if (state.pending) land(); }
  else if (act === 'roll') roll();
  else if (act === 'rules') showRules();
  else if (act === 'edit') showEdit();
  else if (act === 'timer') startTimer(t);
  else if (act === 'sound') { setup.sound = !setup.sound; save(); if (setup.sound) { unlockAudio(); sfx('beep'); } renderPanel(); }
  else if (act === 'quit') showCard({slot: cur().slot, doodle: 'frown', title: '게임을 끝낼까요?', body: '지금까지 모은 하트와 땅으로 순위를 매겨요.', dismiss: true,
      buttons: [{label: '끝내기', primary: true, fn: finish}, {label: '계속하기', fn: closeCard}]});
  else if (act === 'results') showResults();
  else if (act === 'newgame') newGame();
});
document.addEventListener('input', e => {
  if (e.target.matches('.pname')) { setup.slots[+e.target.dataset.i].name = e.target.value; save(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden && cardDismiss) closeCard();
  if (e.key === 'Enter' && e.target.matches('.pname')) e.target.blur();
});

/* ---------- boot ---------- */
function boot(data){
  setup = lsGet('choego.setup') || setup;
  if (!setup.slots || setup.slots.length !== 4) setup.slots = DEFAULT_NAMES.map(n => ({name: n, on: true}));
  if (setup.sound == null) setup.sound = true;
  missions = lsGet('choego.missions');
  if (!Array.isArray(missions) || missions.length !== N) missions = null;
  savedGame = lsGet('choego.game');
  if (data && data.state) { state = data.state; if (data.setup) setup = data.setup; if ('missions' in data) missions = data.missions; }
  applyTextures(); renderDefs(); renderBoard(); renderAll();
  if (state.phase === 'play' && state.pending) setTimeout(land, 300);
}
boot({});

/* home-screen app: block pinch zoom, work offline */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
</body>
</html>
